[project]
name = "backend"
version = "0.1.0"
description = "Cybersecurity Agents Platform backend - owns all persistence, migrations, and orchestration."
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.141.1,<0.142.0",
    "uvicorn[standard]>=0.52.1,<0.53.0",
    "sqlalchemy>=2.0.51,<3.0.0",
    "asyncpg>=0.31.0,<0.32.0",
    "greenlet>=3.5.4,<4.0.0",
    "alembic>=1.18.5,<2.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "arq>=0.28.0,<0.29.0",
    "httpx>=0.28.1,<0.29.0",
    "structlog>=26.1.0,<27.0.0",
    # Required by FastAPI for UploadFile / Form. Absent from the Phase 1 lock,
    # where it only appeared inside unselected fastapi[all] extras metadata.
    "python-multipart>=0.0.20,<0.1.0",
    # Blocks XXE and entity expansion (billion laughs) on uploaded scan XML, and
    # keeps ruff's S314/S405/S320 satisfied without a noqa.
    "defusedxml>=0.7.1,<0.8.0",
    "cyberagents-contracts",
]

[tool.poetry]
# This is an application, not a library: nothing to install as a root package.
package-mode = false

[tool.poetry.dependencies]
# The shared Finding contract lives at the repository root and is installed
# into THIS module's own virtualenv. No virtualenv is shared between modules.
cyberagents-contracts = { path = "../contracts", develop = true }

[tool.poetry.group.dev.dependencies]
ruff = "^0.16.1"
mypy = "^2.3.0"
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
types-defusedxml = "^0.7.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

# ------------------------------------------------------------------- ruff --

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "ANN", "ASYNC", "S", "RUF"]
ignore = [
    "ANN401", # typing.Any is deliberate in a few evidence/payload signatures.
    "S104",   # Binding 0.0.0.0 is intentional inside containers.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN201"]
"alembic/env.py" = ["ANN"]

[tool.ruff.lint.isort]
# There is an alembic/ directory here, so say explicitly that the "alembic"
# import is the library and not this project's migration package.
known-third-party = ["alembic"]

# ------------------------------------------------------------------- mypy --

[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
strict = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["arq.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------- pytest --

[tool.pytest.ini_options]
testpaths = ["tests"]
# package-mode is false, so put the module root on sys.path explicitly.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires live PostgreSQL or Redis (skipped when unavailable)",
]
