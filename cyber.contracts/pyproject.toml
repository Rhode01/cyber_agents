[project]
name = "cyber-contracts"
version = "0.6.0"
description = "Shared service-to-service contract between backend and ai.engine."
requires-python = ">=3.12,<4.0"
dependencies = ["pydantic>=2.13.4,<3.0.0"]

[tool.poetry]
packages = [{ include = "cyber_contracts" }]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ANN", "RUF"]
