[project]
name = "cyber-mcp-server"
version = "0.1.0"
description = "MCP server exposing platform capabilities to MCP hosts. Stub in Phase 1."
requires-python = ">=3.12,<4.0"
dependencies = [
    # starlette is not pinned here: mcp owns that constraint, and this module
    # only uses it to mount the MCP app alongside a health route.
    "mcp>=2.0.0,<3.0.0",
    "uvicorn[standard]>=0.52.1,<0.53.0",
    "pydantic>=2.13.4,<3.0.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "httpx>=0.28.1,<0.29.0",
    # TXT and MX lookups for phishing enrichment. The standard library can resolve
    # A/AAAA records and nothing else, and SPF/DMARC/DKIM all live in TXT.
    # Imported defensively in app/tools/dnsrecords.py, so the server still starts
    # without it and that one tool reports itself unavailable.
    "dnspython>=2.7.0,<3.0.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = "^0.16.1"
mypy = "^2.3.0"
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "ANN", "ASYNC", "S", "RUF"]
ignore = ["S104"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN201"]
# ANN401: the enrichment tests use fixtures that return installer callables, whose
# parameter is the scripted response table. Typing those precisely would mean a Protocol
# per fixture describing a shape only the test uses; `Any` at a test-fixture boundary is
# the honest annotation.
"tests/unit/test_enrichment_lookups.py" = ["S101", "ANN201", "ANN401"]

[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
strict = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# Tool bodies stay fully annotated; only the @mcp.tool() decorator is opaque
# here, which is a consequence of the skip above rather than our code.
module = ["app.server"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# package-mode is false, so put the module root on sys.path explicitly.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
